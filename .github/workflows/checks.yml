# Runs on every pull request and every push to main: the typecheck, the tests, and the
# abbreviation check on reviews. A red cross on a pull request means do not merge yet.
# The abbreviation check only warns: it is a guess, and reviews are published straight to main.
name: Checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the comment, vote and rating tests. It lives only as long
    # as this run and never sees the live database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pais_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pais_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:abbreviations -- --warn
